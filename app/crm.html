<style>

rder:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;max-width:100%}textarea{resize:vertical;min-height:88px}.board{position:relative;display:flex;overflow-x:auto;gap:12px;padding:0 16px 16px;scroll-snap-type:x proximity;align-items:flex-start}.column{flex:0 0 278px;background:#13161b;border:1px solid var(--line);border-radius:14px;scroll-snap-align:start;max-height:calc(100dvh - 248px);overflow-y:auto;min-height:180px}.col-head{position:sticky;top:0;background:#13161b;border-bottom:1px solid var(--line);padding:14px;z-index:1}.col-head h2{font-size:14px;margin:0 0 5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:7px}.won .dot{background:var(--green)}.lost .dot{background:var(--red)}.deal{margin:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}.deal-open{display:block;background:transparent;border:0;color:var(--ink);text-align:left;padding:0;width:100%;min-height:44px;overflow-wrap:anywhere}.deal-open strong{display:block;font-size:15px}.deal-title{font-size:12px;color:var(--mut);margin-top:4px}.amount{font-size:19px;font-weight:700;margin:10px 0}.deal-foot{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.stage-btn{margin-top:12px;background:var(--card2);border:0;border-radius:8px;color:#a8caff;padding:9px;width:100%;min-height:40px;font-size:12px}.content{padding:0 16px}.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:15px;margin-bottom:12px;overflow-wrap:anywhere}.card h2,.card h3{font-size:16px;margin:0 0 12px}.empty{padding:24px 14px;color:var(--mut);font-size:14px;text-align:center;line-height:1.5}.hint{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0}.error{color:#ff9fa4;font-size:13px;white-space:pre-wrap;line-height:1.5}.status{padding:0 16px 10px;font-size:12px;color:var(--mut)}.status:empty{display:none}.client-row{display:block;width:100%;text-align:left;color:var(--ink)}.client-row strong{display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stat{font-size:22px;font-weight:700;margin-top:8px}.metric{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}.metric:last-child{border:0}.sheet-bg{position:fixed;inset:0;background:#0009;z-index:40}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92dvh;overflow:auto;overscroll-behavior:contain}.sheet header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet h2{font-size:18px;margin:0;overflow-wrap:anywhere}.sheet h3{font-size:15px;margin:22px 0 12px}.sheet[hidden],.sheet-bg[hidden],[hidden]{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.actions>*{flex:1;text-align:center}.pill{display:inline-block;background:var(--card2);padding:5px 9px;border-radius:7px;font-size:12px;color:#a9caff}.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}.timeline{border-left:2px solid var(--line);margin:12px 0 0 6px;padding-left:14px}.event{margin-bottom:18px}.event .muted{font-size:11px;margin-bottom:6px}.item{padding:10px;background:var(--bg);border-radius:10px;margin:10px 0}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item-grid .field{margin:0 0 8px}.item .field:first-child{margin-top:0}.danger{color:#ff9fa4}.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.file{border:1px solid var(--line);padding:8px;border-radius:10px;font-size:12px;overflow-wrap:anywhere}.file img{width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px}.toast{position:fixed;bottom:24 .cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.cat-rowc{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--card,#181b21);border:1px solid var(--line,#2a2e37);border-radius:14px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit;overflow:hidden}

.cat-rowc-head .muted{font-size:11.5px;flex:0 0 auto}
.cat-strip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;max-width:100%}
.cat-strip img{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:0 0 58px;background:#20242c}
.cat-strip .cat-noimg{width:58px;height:58px;border-radius:9px;background:#20242c;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 58px}
.tarr{padding:6px 12px;font-size:13px;flex:0 0 auto}
.drag-h{font-size:17px;color:var(--mut,#9aa0a8);padding:8px 10px;cursor:grab;opacity:.75;user-select:none;flex:0 0 auto;margin:-8px -6px -8px 0}
.cat-var{position:relative}
.cat-var .drag-h{position:absolute;top:6px;right:6px;margin:0}
.wa-head{display:flex;align-items:center;gap:10px;margin:-4px -4px 0;padding:8px 6px;background:#1f2c34;border-radius:12px}
.wa-ava{width:38px;height:38px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 38px}
.wa-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}

.wa-row{display:flex;padding:1px 0}
.wa-row.in{justify-content:flex-start}
.wa-row.out{justify-content:flex-end}
.wa-b{position:relative;max-width:84%;padding:7px 10px 8px;border-radius:9px;font-size:14.2px;line-height:1.35;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.wa-row.in .wa-b{background:#202c33;border-top-left-radius:0;color:#e9edef}

<body>
<main class="wrap" id="app">
  <header class="top"><div class="row"><a class="iconbtn" href="home.html" aria-label="В прихожую">‹</a><span class="logo">B</span><div class="grow"><h1>CRM</h1><div class="muted" id="who">Загрузка…</div></div><button class="iconbtn" id="refresh" aria-label="Обновить">↻</button></div></header>
