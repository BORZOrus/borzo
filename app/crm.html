<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>BORZO · CRM</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--card2:#20242c;--ink:#eef0f3;--mut:#9aa0a8;--line:#2a2e37;--blue:#3b82f6;--green:#28c07a;--red:#f0555c;--amber:#f0a621}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#94bdff;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #94bdff;outline-offset:2px}.wrap{max-width:520px;min-height:100vh;margin:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.logo{display:grid;place-items:center;background:var(--blue);color:white;font-weight:800;width:36px;height:36px;border-radius:10px}.muted{color:var(--mut);font-size:13px}.top h1{font-size:18px;margin:0}.iconbtn,.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}.tabs{display:flex;overflow-x:auto;gap:6px;padding:12px 16px;scrollbar-width:thin}.tabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px 12px;min-height:44px;font-size:13px;font-weight:600}.tabs button.on{background:#1c3051;color:#aacdff;border-color:#3665a9}.toolbar{padding:4px 16px 14px;display:flex;gap:8px}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:600;min-height:44px;padding:11px 14px}.btn.block{width:100%}.toolbar input{min-width:0;flex:1}.toolbar .btn{white-space:nowrap}.field{display:block;margin:12px 0;color:var(--mut);font-size:13px}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px}input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;max-width:100%}textarea{resize:vertical;min-height:88px}.board{position:relative;display:flex;overflow-x:auto;gap:12px;padding:0 16px 16px;scroll-snap-type:x proximity;align-items:flex-start}.column{flex:0 0 278px;background:#13161b;border:1px solid var(--line);border-radius:14px;scroll-snap-align:start;max-height:calc(100dvh - 248px);overflow-y:auto;min-height:180px}.col-head{position:sticky;top:0;background:#13161b;border-bottom:1px solid var(--line);padding:14px;z-index:1}.col-head h2{font-size:14px;margin:0 0 5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:7px}.won .dot{background:var(--green)}.lost .dot{background:var(--red)}.deal{margin:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}.deal-open{display:block;background:transparent;border:0;color:var(--ink);text-align:left;padding:0;width:100%;min-height:44px;overflow-wrap:anywhere}.deal-open strong{display:block;font-size:15px}.deal-title{font-size:12px;color:var(--mut);margin-top:4px}.amount{font-size:19px;font-weight:700;margin:10px 0}.deal-foot{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.stage-btn{margin-top:12px;background:var(--card2);border:0;border-radius:8px;color:#a8caff;padding:9px;width:100%;min-height:40px;font-size:12px}.content{padding:0 16px}.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:15px;margin-bottom:12px;overflow-wrap:anywhere}.card h2,.card h3{font-size:16px;margin:0 0 12px}.empty{padding:24px 14px;color:var(--mut);font-size:14px;text-align:center;line-height:1.5}.hint{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0}.error{color:#ff9fa4;font-size:13px;white-space:pre-wrap;line-height:1.5}.status{padding:0 16px 10px;font-size:12px;color:var(--mut)}.status:empty{display:none}.client-row{display:block;width:100%;text-align:left;color:var(--ink)}.client-row strong{display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stat{font-size:22px;font-weight:700;margin-top:8px}.metric{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}.metric:last-child{border:0}.sheet-bg{position:fixed;inset:0;background:#0009;z-index:40}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92dvh;overflow:auto;overscroll-behavior:contain}.sheet header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet h2{font-size:18px;margin:0;overflow-wrap:anywhere}.sheet h3{font-size:15px;margin:22px 0 12px}.sheet[hidden],.sheet-bg[hidden],[hidden]{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.actions>*{flex:1;text-align:center}.pill{display:inline-block;background:var(--card2);padding:5px 9px;border-radius:7px;font-size:12px;color:#a9caff}.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}.timeline{border-left:2px solid var(--line);margin:12px 0 0 6px;padding-left:14px}.event{margin-bottom:18px}.event .muted{font-size:11px;margin-bottom:6px}.item{padding:10px;background:var(--bg);border-radius:10px;margin:10px 0}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item-grid .field{margin:0 0 8px}.item .field:first-child{margin-top:0}.danger{color:#ff9fa4}.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.file{border:1px solid var(--line);padding:8px;border-radius:10px;font-size:12px;overflow-wrap:anywhere}.file img{width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#30415e;color:white;padding:12px 18px;border-radius:12px;z-index:70;max-width:90%;font-size:14px;box-shadow:0 8px 28px #0008}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.import-map{margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:360px){.toolbar{flex-wrap:wrap}.toolbar input{width:100%}.column{flex-basis:calc(100vw - 42px)}.stat{font-size:18px}}@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top"><div class="row"><a class="iconbtn" href="home.html" aria-label="В прихожую">‹</a><span class="logo">B</span><div class="grow"><h1>CRM</h1><div class="muted" id="who">Загрузка…</div></div><button class="iconbtn" id="refresh" aria-label="Обновить">↻</button></div></header>
  <nav class="tabs" aria-label="Разделы CRM"><button data-tab="deals" class="on" aria-current="page">Сделки</button><button data-tab="clients">Клиенты</button><button data-tab="analytics">Аналитика</button><button data-tab="templates">Шаблоны</button><button data-tab="import" id="import-tab" hidden>Импорт</button></nav>
  <div class="toolbar" id="toolbar"><label class="sr-only" for="search">Поиск по имени, телефону или сделке</label><input type="search" id="search" placeholder="Имя или телефон" autocomplete="off"><button class="btn" id="new-deal" disabled>+ Заявка</button></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="main"><div class="empty">Загружаю CRM…</div></div>
</main>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden><header><h2 id="sheet-title"></h2><button class="iconbtn" id="sheet-close" aria-label="Закрыть">✕</button></header><div id="sheet-body"></div></section>
<div id="toast" class="toast" role="status" hidden></div>
<script src="api.js?v=crm1"></script>
<script src="crm.js?v=crm1"></script>
</body>
</html>
