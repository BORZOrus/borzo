body.view-deals{overflow:hidden}.col-head h2{font-size:15px;margin:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:7px}.won .dot{background:var(--green)}.lost .dot{background:var(--red)}.deal{margin:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(17,27,33,.06)}.deal-open{display:block;background:transparent;border:0;color:var(--ink);text-align:left;padding:0;width:100%;min-height:44px;overflow-wrap:anywhere}.deal-open strong{display:block;font-size:17px}.deal-title{font-size:14px;color:var(--mut);margin-top:4px}.amount{font-size:21px;font-weight:700;margin:10px 0}.deal-foot{font-size:14px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.stage-btn{margin-top:12px;background:#e7f6f1;border:0;border-radius:8px;color:#00705c;padding:5px 9px;width:100%;min-height:30px;font-size:13px;font-weight:600}.content{padding:0 16px}.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;margin-bottom:12px;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(17,27,33,.05)}.card h2,.card h3{font-size:18px;margin:0 0 12px}.empty{padding:24px 14px;color:var(--mut);font-size:16px;text-align:center;line-height:1.5}.hint{font-size:14px;color:var(--mut);line-height:1.5;margin:8px 0}.error{color:#c62830;font-size:15px;white-space:pre-wrap;line-height:1.5}.status{padding:0 16px 10px;font-size:14px;color:var(--mut)}.status:empty{display:none}.client-row{display:block;width:100%;text-align:left;color:var(--ink)}.client-row strong{display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stat{font-size:24px;font-weight:700;margin-top:8px}.metric{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:16px}.metric:last-child{border:0}.sheet-bg{position:fixed;inset:0;background:rgba(17,27,33,.42);z-index:40 .cat-rowc{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit;overflow:hidden;box-shadow:0 1px 2px rgba(17,27,33,.05)}

.wa-row{display:flex;padding:1px 0}
.wa-row.in{justify-content:flex-start}
.wa-row.out{justify-content:flex-end}
.wa-b{position:relative;max-width:84%;padding:7px 10px 8px;border-radius:9px;font-size:16.2px;line-height:1.35;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(17,27,33,.14)}
.wa-row.in .wa-b{background:#fff;border-top-left-radius:0;color:var(--ink)}

.wa-row.in .wa-b:before{content:'';position:absolute;left:-7px;top:0;border:7px solid transparent;border-top-color:#fff;border-right-color:#fff;border-left:0}

.wa-tick.err{color:#c62830}

.wa-tokz:disabled{opacity:.55}

.wa-hd{font-size:14px;font-weight:700;color:#00705c}

.wa-rec-time{font-variant-numeric:tabular-nums;font-size:16px;color:#54656f;min-width:40px;text-align:right;flex:0 0 auto}

.board{scrollbar-width:none;-ms-overflow-style:none}.board::-webkit-scrollbar{display:none}

.wa-note{font-size:13.5px;color:#8a6d3b;background:#fdf6e3;border:1px solid #f0e2b8;border-radius:8px;padding:6px 10px;margin:0 -6px 6px;text-align:center}

.agc-card{background:#f3f0fb;border-color:#ddd3f2}

.scr-save{flex:1;background:var(--blue);border:none;color:#fff;border-radius:8px;padding:9px;font-weight:600;min-height:40px}
.scr-lbl-edit{min-height:0;padding:1px 7px;font-size:13px;margin-left:6px;line-height:1.4;text-transform:none}
.scr-ins,.scr-att-send{transition:transform .09s ease,box-shadow .12s,background .15s}
.scr-sending{transform:scale(.93);box-shadow:inset 0 2px 7px rgba(0,0,0,.28);opacity:.95}
.scr-sent{animation:scrPop .4s ease}
.scr-sent::after{content:' ✓';font-weight:900}
@keyframes scrPop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.scr-cancel{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:9px 14px;min-height:40px}
.ch-tpl{display:flex;flex-direction:column;gap:4px;margin:6px 0;max-height:30vh;overflow-y:auto}
.dragging{opacity:.45;outline:1.5px dashed var(--amber)}
.wa-link{color:#1a73e8;text-decoration:underline;overflow-wrap:anywhere}
.wa-row.out .wa-link{color:#075e54}
/* на телефоне окна разворачиваются на весь экран. Чат (где есть .wa-log) — колонкой: шапка/этапы/поле фикс, лента растягивается. Остальные окна — обычная прокрутка */
@media(max-width:600px){
.sheet{top:0;max-width:100%;max-height:none;border-radius:0;border:0;overflow:hidden;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sheet>#sheet-body{flex:1 1 auto;min-height:0;overflow:auto}
.sheet>#sheet-body:has(.wa-log){display:flex;flex-direction:column;overflow:hidden}
.sheet>#sheet-body:has(.wa-log)>*{flex:0 0 auto}
.sheet>#sheet-body:has(.wa-log)>.wa-log{flex:1 1 auto;height:auto;min-height:120px}
.sheet:has(#sheet-body .wa-log)>header{display:none}
/* чат — во всю ширину экрана, без боковых полей (в формах отступы остаются) */
.sheet:has(#sheet-body .wa-log){padding-left:0;padding-right:0;padding-top:0}
.wa-head{margin-left:0;margin-right:0;border-radius:0;border-left:0;border-right:0}
.wa-log{margin-left:0;margin-right:0;border-radius:0}
.wa-note{margin-left:0;margin-right:0}
.wa-stages,.wa-input,.ch-tpl,.ch-reply{padding-left:8px;padding-right:8px}
}
</style>
